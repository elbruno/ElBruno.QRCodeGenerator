name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (leave empty to use csproj version)"
        required: false
        type: string
      package_set:
        description: "Use all packages only after the PDF and tool dependencies are verified"
        required: true
        default: safe
        type: choice
        options:
          - safe
          - all

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for OIDC token exchange with NuGet
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            11.0.x

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"   # strip leading v  (v1.0.0 → 1.0.0)
            VERSION="${VERSION#.}"   # strip stray dot  (.1.0.0 → 1.0.0)
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep -oP '<Version>\K[^<]+' src/ElBruno.QRCodeGenerator.CLI/ElBruno.QRCodeGenerator.CLI.csproj)
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "❌ Invalid version string: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore ElBruno.QRCodeGenerator.slnx

      - name: Build
        run: dotnet build ElBruno.QRCodeGenerator.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test ElBruno.QRCodeGenerator.slnx -c Release --no-build --framework net8.0

      - name: Pack
        run: |
          package_set="${{ inputs.package_set || 'safe' }}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            package_set="safe"
          fi
          case "$package_set" in
            safe)
              packages=(CLI Payloads Svg Image Ascii)
              ;;
            all)
              packages=(CLI Payloads Svg Image Ascii Pdf Tool)
              ;;
            *)
              echo "Invalid package set: '$package_set'"
              exit 1
              ;;
          esac
          for package in "${packages[@]}"; do
            dotnet pack "src/ElBruno.QRCodeGenerator.$package/ElBruno.QRCodeGenerator.$package.csproj" -c Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./nupkgs
          done

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
